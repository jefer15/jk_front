<div class="p-4 space-y-4">
  <div class="overflow-x-auto rounded-lg shadow">
    <table mat-table [dataSource]="dataSource" matSort class="w-full">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header
          class="px-6 py-3 text-left text-xs font-bold text-white uppercase tracking-wider"> ID </th>
        <td mat-cell *matCellDef="let row" class="px-6 py-4 whitespace-nowrap text-sm text-white"> {{row.id}} </td>
      </ng-container>

      <ng-container matColumnDef="identification">
        <th mat-header-cell *matHeaderCellDef mat-sort-header
          class="px-6 py-3 text-left text-xs font-bold text-white uppercase tracking-wider"> Identificación </th>
        <td mat-cell *matCellDef="let row" class="px-6 py-4 whitespace-nowrap text-sm text-white"> {{row.identification}} </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header
          class="px-6 py-3 text-left text-xs font-bold text-white uppercase tracking-wider"> Nombre </th>
        <td mat-cell *matCellDef="let row" class="px-6 py-4 whitespace-nowrap text-sm text-white"> {{row.name}}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header
          class="px-6 py-3 text-left text-xs font-bold text-white uppercase tracking-wider"> Correo </th>
          <td mat-cell *matCellDef="let row" class="px-6 py-4 whitespace-nowrap text-sm text-white"> {{row.email}}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-gray-50"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="bg-white border-b hover:bg-gray-50"></tr>
    </table>
  </div>

  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" class="mt-4"></mat-paginator>
</div>
