<div class="p-4 space-y-4">
  <div class="overflow-x-auto rounded-lg shadow">
    <table mat-table [dataSource]="dataSource" matSort class="w-full">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef mat-sort-header
          class="px-6 py-3 text-left text-xs font-bold text-gray uppercase tracking-wider bg-blue-600"> ID </th>
        <td mat-cell *matCellDef="let row" class="px-6 py-4 whitespace-nowrap text-sm text-gray-700 bg-blue-50"> {{row.id}} </td>
      </ng-container>

      <ng-container matColumnDef="identification">
        <th mat-header-cell *matHeaderCellDef mat-sort-header
          class="px-6 py-3 text-left text-xs font-bold text-gray uppercase tracking-wider bg-blue-600"> Identificación </th>
        <td mat-cell *matCellDef="let row" class="px-6 py-4 whitespace-nowrap text-sm text-gray-700 bg-blue-50"> {{row.identification}} </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header
          class="px-6 py-3 text-left text-xs font-bold text-gray uppercase tracking-wider bg-blue-600"> Nombre </th>
        <td mat-cell *matCellDef="let row" class="px-6 py-4 whitespace-nowrap text-sm text-gray-700 bg-blue-50"> {{row.name}}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header
          class="px-6 py-3 text-left text-xs font-bold text-gray uppercase tracking-wider bg-blue-600"> Correo </th>
        <td mat-cell *matCellDef="let row" class="px-6 py-4 whitespace-nowrap text-sm text-gray-700 bg-blue-50"> {{row.email}}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-blue-600"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"
          class="bg-blue-50 border-b hover:bg-blue-100 transition-colors duration-200"></tr>
    </table>
  </div>

  <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" class="mt-4"></mat-paginator>
</div>
